services:
  - type: web
    name: technova
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WA_NUMBER
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_RFC
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_EMAIL
        sync: false
  - type: web
    name: technova-n8n
    image: n8nio/n8n
    plan: free
    healthCheckPath: /
    envVars:
      - key: N8N_PORT
        value: 5678
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_SECURE_COOKIE
        value: false
      - key: WEBHOOK_URL
        value: https://technova-n8n.onrender.com
      - key: N8N_DEFAULT_EMAIL
        value: neervison@gmail.com
      - key: N8N_DEFAULT_PASSWORD
        value: TechNova2026!
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: TechNova2026!
